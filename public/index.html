<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Room 文慶大腦 V2.1</title>

  <style>
    body{
      font-family: Arial, "Microsoft JhengHei";
      background:#f6f1e8;
      margin:0;
      padding:30px;
      color:#2c241c;
    }

    .box{
      max-width:900px;
      margin:auto;
      background:white;
      border-radius:20px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    h1{
      margin-top:0;
    }

    input, textarea{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid #ddd;
      margin-top:8px;
      margin-bottom:20px;
      box-sizing:border-box;
      font-size:16px;
    }

    textarea{
      min-height:100px;
    }

    button{
      width:100%;
      border:none;
      background:#9a6a37;
      color:white;
      padding:16px;
      border-radius:14px;
      font-size:18px;
      cursor:pointer;
      font-weight:bold;
    }

    pre{
      white-space:pre-wrap;
      background:#fff8ef;
      padding:20px;
      border-radius:14px;
      margin-top:20px;
      line-height:1.7;
    }
  </style>
</head>

<body>

<div class="box">

<h1>One Room 文慶大腦 V2.1</h1>

<p>
員工填案件 → AI 幫忙初步分析 → 產出文慶口氣 LINE 話術
</p>

<label>地區</label>
<input id="area" placeholder="例：台北 / 桃園龍潭">

<label>預算</label>
<input id="budget" placeholder="例：150000">

<label>風格</label>
<input id="style" placeholder="例：簡單高級 / 精品感 / 奶油風">

<label>客人需求</label>
<textarea id="needs"></textarea>

<label>風險 / 現場限制</label>
<textarea id="risk"></textarea>

<button onclick="sendCase()">
送出給 One Room AI 分析
</button>

<pre id="output">
尚未送出
</pre>

</div>

<script>

async function sendCase(){

  const data = {
    area: document.getElementById("area").value,
    budget: document.getElementById("budget").value,
    style: document.getElementById("style").value,
    needs: document.getElementById("needs").value,
    risk: document.getElementById("risk").value
  };

  document.getElementById("output").innerText = "分析中...";

  try{

    const res = await fetch("/analyze",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(data)
    });

    const json = await res.json();

    document.getElementById("output").innerText =
      json.result || JSON.stringify(json,null,2);

  }catch(err){

    document.getElementById("output").innerText =
      "錯誤：" + err.message;

  }

}

</script>

</body>
</html>
