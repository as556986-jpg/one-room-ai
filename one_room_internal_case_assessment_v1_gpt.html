<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Room 文慶大腦 VIP 完整案件表單</title>
<link rel="stylesheet" href="public/style.css">
</head>
<body>
<main class="app">
<section class="hero">
<div>
<p class="eyebrow">One Room VIP｜員工內部案件評估系統</p>
<h1>文慶大腦 VIP 完整案件表單</h1>
<p class="subtitle">員工填案件、上傳照片、產出內部報告、文慶判斷與 LINE 話術。</p>
</div>
<div class="status-card"><span>標準流程</span><strong>客人 → 員工填表 → AI 初判 → 文慶複核</strong></div>
</section>

<form id="caseForm" class="form-grid">
<section class="panel">
<h2>① 案件基本資料</h2>
<div class="grid two">
<label>案件名稱 / 客戶暱稱<input name="caseName" placeholder="例：桃園龍潭簡單高級房"></label>
<label>來源管道<select name="leadSource"><option>LINE</option><option>IG</option><option>FB</option><option>老客介紹</option><option>其他</option></select></label>
<label>客戶地區<input name="area" placeholder="例：桃園龍潭 / 台北 / 新竹"></label>
<label>坪數<input name="size" placeholder="例：5坪 / 7坪"></label>
<label>樓層<input name="floor" placeholder="例：2樓"></label>
<label>有無電梯<select name="elevator"><option>有</option><option>無</option><option>不確定</option></select></label>
<label>客戶預算<input name="budget" placeholder="例：15萬內 / 10萬 / 不確定"></label>
<label>急迫程度<select name="urgency"><option>普通</option><option>急</option><option>很急</option><option>不急</option></select></label>
</div>
</section>

<section class="panel">
<h2>② 空間與屋況</h2>
<div class="grid two">
<label>空間類型<select name="spaceType"><option>臥室</option><option>套房</option><option>客廳</option><option>電競房</option><option>出租房</option><option>情侶房</option><option>書房</option><option>其他</option></select></label>
<label>屋況<select name="houseCondition"><option>空屋</option><option>租屋</option><option>一般中古屋</option><option>老屋</option><option>新成屋</option><option>很亂</option></select></label>
</div>
<label>現場限制 / 風險<textarea name="siteRisk" placeholder="例：無電梯、樓梯窄、壁癌、老屋、東西很多、需清運、重拉電"></textarea></label>
<div class="checks">
<label><input type="checkbox" name="riskTags" value="無電梯">無電梯</label>
<label><input type="checkbox" name="riskTags" value="壁癌">壁癌</label>
<label><input type="checkbox" name="riskTags" value="老屋">老屋</label>
<label><input type="checkbox" name="riskTags" value="需清運">需清運</label>
<label><input type="checkbox" name="riskTags" value="重拉燈線">重拉燈線</label>
<label><input type="checkbox" name="riskTags" value="玻璃衣櫃">玻璃衣櫃</label>
<label><input type="checkbox" name="riskTags" value="大型家具搬運">大型家具搬運</label>
<label><input type="checkbox" name="riskTags" value="客戶預算偏低">預算偏低</label>
</div>
</section>

<section class="panel">
<h2>③ 客戶需求與風格</h2>
<label>客戶原話 / 真正需求<textarea name="clientWords" placeholder="例：簡單高級、不要太多東西、帶人回家方便、不要油條、有品味"></textarea></label>
<label>想做風格<input name="style" placeholder="例：簡單高級 / 奶油風 / 精品飯店感 / 低調科技感"></label>
<div class="checks">
<label><input type="checkbox" name="needTags" value="燈光">燈光</label>
<label><input type="checkbox" name="needTags" value="窗簾">窗簾</label>
<label><input type="checkbox" name="needTags" value="油漆">油漆</label>
<label><input type="checkbox" name="needTags" value="地板">地板</label>
<label><input type="checkbox" name="needTags" value="床組">床組</label>
<label><input type="checkbox" name="needTags" value="衣櫃">衣櫃</label>
<label><input type="checkbox" name="needTags" value="電腦區">電腦區</label>
<label><input type="checkbox" name="needTags" value="收納">收納</label>
<label><input type="checkbox" name="needTags" value="清運">清運</label>
<label><input type="checkbox" name="needTags" value="設計圖">設計圖</label>
</div>
<label>員工直覺補充<textarea name="staffNote" placeholder="例：客人感覺重視質感、怕亂、預算可談、可能需要先推設計圖"></textarea></label>
</section>

<section class="panel">
<h2>④ 照片上傳</h2>
<p class="hint">建議至少上傳：全景、地板、天花燈具、窗戶、門口/樓梯、舊家具、問題特寫、參考風格圖。</p>
<label>案件照片<input id="photos" type="file" accept="image/*" multiple></label>
<div id="photoPreview" class="photo-preview"></div>
</section>

<section class="actions">
<button type="button" onclick="buildReport()">產生內部報告</button>
<button type="button" onclick="copyReport()">複製報告</button>
<button type="button" onclick="downloadReport()">下載 TXT</button>
<button type="button" class="primary" onclick="sendToBrain()">送出文慶 AI 分析</button>
</section>
</form>

<section class="panel output-panel"><h2>⑤ 內部案件報告</h2><pre id="reportOutput">尚未產生報告。</pre></section>
<section class="panel output-panel"><h2>⑥ 文慶大腦回覆</h2><pre id="aiOutput">尚未送出 AI 分析。</pre></section>
</main>
<script src="public/app.js"></script>
</body>
</html>
